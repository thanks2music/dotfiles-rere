name: "EXPERIMENT: Review (plugin)"

# 公式 plugin 方式。code.claude.com/docs/en/github-actions の "Run a skill" の例に準拠。
# Anthropic が保守する code-review plugin を使う。挙動の特徴:
# - 指示文は英語。確度の高いバグと CLAUDE.md 違反だけを指摘する (スタイル等は指摘しない)
# - draft / close 済み / 自明な PR、および Claude が既にコメントした PR はスキップする
#   (= push のたびに再レビューはされず、実質 PR ごとに 1 回)
# - 内部で複数のサブエージェントを起動するため、自由文方式より重い
# 日本語で push ごとにレビューしたい場合は claude-code-review.yml (自由文方式) を使う。

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    # fork PR (secret なし) と bot PR (action が既定で拒否) をスキップ
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # Claude GitHub App のトークン交換 (OIDC) に必須

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          # Console の API キーを使う場合は `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}` に置き換える
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # --comment が無いと結果は run ログにしか出ない
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # skill 側の allowed-tools にもあるが、inline コメント用 MCP サーバーは
          # claude_args の --allowedTools に名前がある時だけ起動するため必須
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
